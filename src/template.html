<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
  </head>
  <body>
    <div class="page-header-container">
      <h1 class="page-header">NoJam Weather</h1>
    </div>
    <form class="location-entry-form">
      <input
        class="location-input"
        type="text"
        placeholder="Please enter your location"
      />
      <button class="location-submit-button" type="submit">Submit</button>
    </form>
    <div class="weather-display-container">
      <div class="current-weather-container"></div>
      <div class="forecast-container"></div>
    </div>
  </body>
</html>
